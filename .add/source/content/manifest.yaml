kind: ADDCanonicalInventory
canonical_version: 3.0.0
content_language: zh-CN

bindings:
  schemaVersion: 1
  definitions:
    - key: project.name
      type: string
      source: {kind: config, path: [project, name]}
      required: true
      allowEmpty: false
      render: inline
      aliases: ['<待填充:project-name>']
    - key: project.description
      type: string
      source: {kind: config, path: [project, description]}
      required: true
      allowEmpty: true
      render: block
      aliases: []
    - key: project.repo_layout
      type: string
      source: {kind: config, path: [project, repoLayout]}
      required: true
      allowEmpty: false
      render: inline
      aliases: ['<待填充:repo-layout>']
    - key: project.module_map
      type: string-list
      source: {kind: config, path: [project, moduleMap]}
      required: true
      allowEmpty: true
      render: list
      aliases: ['<待填充:module-map>']
    - key: project.check_commands
      type: string-list
      source: {kind: config, path: [project, checkCommands]}
      required: true
      allowEmpty: true
      render: list
      aliases: ['<待填充:check-commands>']
    - key: project.security_policy
      type: string
      source: {kind: config, path: [project, securityPolicy]}
      required: true
      allowEmpty: false
      render: block
      aliases: ['<待填充:config-security-policy>']
    - key: project.enabled_profiles
      type: string-list
      source: {kind: config, path: [profiles]}
      required: true
      allowEmpty: true
      render: list
      aliases: ['<待填充:enabled-profiles>']
    - key: host.root
      type: relpath
      source: {kind: config, path: [runtimes, $host, root]}
      required: true
      allowEmpty: false
      render: path
      aliases: []
    - key: host.prefix
      type: string
      source: {kind: config, path: [runtimes, $host, prefix]}
      required: true
      allowEmpty: false
      render: inline
      aliases: []
    - key: host.team_overview
      type: relpath
      source: {kind: config, path: [runtimes, $host, teamOverview]}
      required: true
      allowEmpty: false
      render: path
      aliases: ['{{TEAM_OVERVIEW}}']
    - key: host.role_dir
      type: relpath
      source: {kind: config, path: [runtimes, $host, roles]}
      required: true
      allowEmpty: false
      render: path
      aliases: ['{{ROLE_DIR}}']
    - key: host.guidance_dir
      type: relpath
      source: {kind: config, path: [runtimes, $host, guidance]}
      required: true
      allowEmpty: false
      render: path
      aliases: ['{{GUIDANCE_DIR}}']
    - key: host.skill_dir
      type: relpath
      source: {kind: config, path: [runtimes, $host, skills]}
      required: true
      allowEmpty: false
      render: path
      aliases: ['{{SKILL_DIR}}']
    - key: host.profile_dir
      type: relpath
      source: {kind: config, path: [runtimes, $host, profiles]}
      required: true
      allowEmpty: false
      render: path
      aliases: ['{{PROFILE_DIR}}']
    - key: host.runbook
      type: relpath
      source: {kind: config, path: [runtimes, $host, runbook]}
      required: true
      allowEmpty: false
      render: path
      aliases: ['{{RUNTIME_RUNBOOK}}']
    - key: host.role_suffix
      type: string
      source: {kind: adapter, field: roleSuffix}
      required: true
      allowEmpty: false
      render: inline
      aliases: ['{{ROLE_SUFFIX}}']

entry:
  - project-guide
  - team-overview

roles:
  - arch-designer
  - backend-dev
  - boundary-griller
  - explorer
  - feature-designer
  - frontend-dev
  - mo
  - req-analyst
  - reviewer
  - steward
  - task-planner
  - test-engineer

core_rules:
  - abstraction-principles
  - agent-framework
  - architecture-principles
  - code-review-checklist
  - coding-standards
  - decisions-guide
  - design-doc-writing-style
  - frontend-coding-standards
  - frontend-design-standards
  - language-preference
  - multi-agent-coordination
  - no-hardcode-policy
  - observability-standards
  - task-execution-workflow
  - tech-stack-compliance
  - tracing-standards

core_skills:
  - adr-decision
  - architecture-design
  - batch-plan
  - boundary-grill
  - bounded-change-workflow
  - code-review
  - delivery-workflow
  - design-tdd
  - e2e-verification
  - git-workflow
  - issue-handling
  - knowledge-curate
  - project-adoption-workflow
  - project-context
  - project-customization
  - project-experience
  - project-initialization
  - release-communication
  - requirement-grill
  - research
  - route-work
  - systematic-debugging
  - task-decompose
  - task-implementation
  - test-design

profiles:
  go-service:
    description: Go 服务端实现约束与测试方法
    rules: [coding-standards, no-hardcode-policy, observability-standards, tracing-standards, security-coding-standards]
    skills: [tdd-go]
  react-web:
    description: React 与 TypeScript Web 实现和设计约束
    rules: [frontend-coding-standards, frontend-design-standards]
    skills: []
  resource-platform:
    description: 声明式资源平台的抽象与生命周期约束
    rules: [abstraction-principles]
    skills: []

targets: [claude, codex, opencode]

projection_policy:
  # 交付闭包不等于运行时加载；专业直达与当前活动续接不先经过总览。
  root_entry: minimal-l1-and-routing
  workflow_discovery: intent-and-current-activity-on-demand
  team_overview: explicit-global-overview-only
  role_body: property-boundary-logical-references
  role_rules: explicit-read
  profiles: explicit-project-selection
  task_context: context-pack
  project_merge: per-domain-append
  overwrite_project_local: false
  runtime_failure: preserve-existing-projection

# 首次显式接口登记。canonical_version 是内容版本，不是单元或 Workflow 接口版本。
# requires 只保证随包交付；实际读取/执行仍由当前任务、正文和授权决定。
# optional 为条件引用，启用前须选择相应单元/profile；requiresContracts 同样校验其 major。
